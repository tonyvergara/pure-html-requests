name: Update README with HTML Links

on:
  push:
    branches: ["main"]
    paths:
      - '**.html'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README with HTML links
        run: |
          # GitHub Pages base URL
          BASE_URL="https://tonyvergara.github.io/pure-html-requests"
          
          # Find all HTML files (excluding any in hidden directories)
          html_files=$(find . -name "*.html" -not -path "*/\.*" | sort)
          
          # Start building the README content
          cat > README.md << 'EOF'
          # pure-html-requests

          ## Available HTML Pages

          This repository contains the following HTML pages, accessible via GitHub Pages:

          EOF
          
          # Add links for each HTML file
          for file in $html_files; do
            # Remove leading ./
            clean_path="${file#./}"
            # Get filename without extension for display
            filename=$(basename "$file" .html)
            # Create a nice display name (replace hyphens and underscores with spaces, capitalize)
            display_name=$(echo "$filename" | sed 's/[-_]/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2))}1')
            # Add the link
            echo "- [$display_name]($BASE_URL/$clean_path)" >> README.md
          done
          
          # Add footer
          cat >> README.md << 'EOF'

          ---

          *This README is automatically updated when new HTML files are added to the repository.*
          EOF

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code README.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto-update README with HTML file links"
          git push
