<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Schedule</title>
<style>
:root {
  --bg: #fafaf7;
  --fg: #1d1d1b;
  --mut: #6b6b66;
  --line: #e2e1da;
  --card: #fff;
  --talk: #3b6fd4;
  --break: #8f8f87;
  --meal: #d9822a;
  --social: #2a9170;
  --workshop: #9b59b6;
  --keynote: #e74c3c;
  --on: #fff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media(prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615;
    --fg: #f0efe8;
    --mut: #a3a29a;
    --line: #33332f;
    --card: #1f1f1d;
    --talk: #4f7fdc;
    --break: #6f6f68;
    --meal: #c0702a;
    --social: #2a8a6b;
    --workshop: #a569c4;
    --keynote: #e95c4e;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #161615;
  --fg: #f0efe8;
  --mut: #a3a29a;
  --line: #33332f;
  --card: #1f1f1d;
  --talk: #4f7fdc;
  --break: #6f6f68;
  --meal: #c0702a;
  --social: #2a8a6b;
  --workshop: #a569c4;
  --keynote: #e95c4e;
  color-scheme: dark;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

main {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 10px 16px;
}

h1 {
  font-size: 28px;
  margin: 20px 0 6px;
  font-weight: 700;
}

.sub {
  color: var(--mut);
  margin: 0 0 16px;
  font-size: 14px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 0 0 12px;
  color: var(--mut);
  font-size: 13px;
}

.legend i {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 3px;
  margin-right: 6px;
  vertical-align: middle;
}

.head {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding: 8px 0;
  margin-left: 50px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  border-bottom: 2px solid var(--line);
}

.head div {
  text-align: center;
  font-weight: 700;
  font-size: 15px;
}

.head small {
  display: block;
  font-weight: 400;
  color: var(--mut);
  font-size: 12px;
}

.box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 0 0 12px 12px;
  position: relative;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  max-width: 800px;
  margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 16px 16px 0 0;
  padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.18);
  transform: translateY(110%);
  transition: transform 0.3s ease;
  z-index: 10;
}

.sheet.open {
  transform: none;
}

body.sheet-open main {
  padding-bottom: 220px;
}

.sheet h2 {
  font-size: 19px;
  margin: 0 32px 6px 0;
  line-height: 1.3;
}

.sheet .meta {
  color: var(--mut);
  font-size: 14px;
  margin-bottom: 12px;
}

.sheet .description {
  color: var(--fg);
  font-size: 14px;
  margin-bottom: 12px;
  line-height: 1.5;
}

.type {
  display: inline-block;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  border-radius: 999px;
  padding: 3px 10px;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.links a {
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--fg);
  color: var(--bg);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  transition: opacity 0.2s;
}

.links a:hover {
  opacity: 0.8;
}

.links .none {
  color: var(--mut);
  font-size: 13px;
}

#x {
  position: absolute;
  top: 10px;
  right: 12px;
  width: 36px;
  height: 36px;
  border: 0;
  background: none;
  color: var(--mut);
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
}

#x:hover {
  color: var(--fg);
}
</style>
</head>
<body>
<main>
  <h1>Tech Conference 2026</h1>
  <p class="sub">Click any session block to view details and links</p>
  <div class="legend" id="legend"></div>
  <div class="head" id="head"></div>
  <div class="box" id="box">
    <canvas id="c"></canvas>
  </div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-label="Event details">
  <button id="x" aria-label="Close">×</button>
  <span class="type"></span>
  <h2></h2>
  <div class="meta"></div>
  <div class="description"></div>
  <div class="links"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// ============================================================================
// CONFIGURATION: Edit event types, days, and schedule items here
// ============================================================================

// Event type definitions: [type_key]: 'Display Name'
const TYPES = {
  keynote: 'Keynote',
  talk: 'Session',
  workshop: 'Workshop',
  break: 'Break',
  meal: 'Meal',
  social: 'Social'
};

// Schedule structure: Each day contains items in format:
// [name, startTime, endTime, type, location, description, links]
// - Times are in 24-hour decimal format (e.g., 13.5 = 1:30 PM)
// - Links format: [['Label', 'URL'], ['Label', 'URL']]
const DAYS = [
  {
    name: 'Day 1',
    sub: 'Monday, Oct 16',
    items: [
      [
        'Registration & Coffee',
        8,
        9,
        'break',
        'Main Lobby',
        'Pick up your badge and enjoy refreshments before the opening keynote.',
        []
      ],
      [
        'Opening Keynote',
        9,
        10,
        'keynote',
        'Grand Hall',
        'Join us for an inspiring opening keynote on the future of technology.',
        [
          ['Speaker Bio', 'https://example.com/speaker'],
          ['Live Stream', 'https://example.com/stream']
        ]
      ],
      [
        'AI & Machine Learning',
        10.25,
        11.75,
        'talk',
        'Room A',
        'Deep dive into the latest advances in AI and ML technologies.',
        [['Session Materials', 'https://example.com/ai-ml']]
      ],
      [
        'Lunch Break',
        12,
        13,
        'meal',
        'Cafeteria',
        'Enjoy lunch with fellow attendees. Networking opportunity!',
        []
      ],
      [
        'Cloud Infrastructure Workshop',
        13.25,
        15.25,
        'workshop',
        'Lab B',
        'Hands-on workshop building scalable cloud infrastructure.',
        [
          ['Workshop Guide', 'https://example.com/workshop'],
          ['Sign Up', 'https://example.com/signup']
        ]
      ],
      [
        'Coffee Break',
        15.5,
        16,
        'break',
        'Lounge',
        'Afternoon refreshments and networking.',
        []
      ],
      [
        'Web Development Panel',
        16.25,
        17.5,
        'talk',
        'Room C',
        'Expert panel discussion on modern web development practices.',
        []
      ],
      [
        'Welcome Reception',
        18,
        20,
        'social',
        'Rooftop Terrace',
        'Join us for drinks and networking on the rooftop terrace.',
        []
      ]
    ]
  },
  {
    name: 'Day 2',
    sub: 'Tuesday, Oct 17',
    items: [
      [
        'Morning Coffee',
        8,
        9,
        'break',
        'Main Lobby',
        'Grab a coffee and get ready for an exciting day.',
        []
      ],
      [
        'DevOps Best Practices',
        9,
        10.5,
        'talk',
        'Grand Hall',
        'Learn about modern DevOps workflows and tools.',
        [['Resources', 'https://example.com/devops']]
      ],
      [
        'Security Workshop',
        11,
        13,
        'workshop',
        'Lab A',
        'Hands-on security testing and best practices workshop.',
        [
          ['Prerequisites', 'https://example.com/prereq'],
          ['Lab Access', 'https://example.com/lab']
        ]
      ],
      [
        'Lunch Break',
        13,
        14,
        'meal',
        'Cafeteria',
        'Lunch and networking time.',
        []
      ],
      [
        'Mobile Development',
        14.25,
        15.75,
        'talk',
        'Room B',
        'Building modern mobile applications for iOS and Android.',
        []
      ],
      [
        'Coffee Break',
        16,
        16.5,
        'break',
        'Lounge',
        'Afternoon break.',
        []
      ],
      [
        'Data Science & Analytics',
        16.75,
        18,
        'talk',
        'Room C',
        'Exploring data science tools and visualization techniques.',
        [['Slides', 'https://example.com/data-science']]
      ],
      [
        'Closing Party',
        19,
        22,
        'social',
        'Main Hall',
        'Celebrate the end of the conference with music, food, and drinks!',
        []
      ]
    ]
  },
  {
    name: 'Day 3',
    sub: 'Wednesday, Oct 18',
    items: [
      [
        'Morning Coffee',
        8,
        9,
        'break',
        'Main Lobby',
        'Final day coffee and catch up.',
        []
      ],
      [
        'Open Source Keynote',
        9,
        10,
        'keynote',
        'Grand Hall',
        'Celebrating open source contributions and the future of collaboration.',
        [['Live Stream', 'https://example.com/stream']]
      ],
      [
        'API Design Workshop',
        10.25,
        12.25,
        'workshop',
        'Lab C',
        'Design and build RESTful APIs following best practices.',
        [['API Docs', 'https://example.com/api-docs']]
      ],
      [
        'Lunch Break',
        12.5,
        13.5,
        'meal',
        'Cafeteria',
        'Final networking lunch.',
        []
      ],
      [
        'Performance Optimization',
        14,
        15.25,
        'talk',
        'Room A',
        'Techniques for optimizing application performance.',
        []
      ],
      [
        'Coffee Break',
        15.5,
        16,
        'break',

        'Last coffee break of the conference.',
        []
      ],
      [
        'Closing Keynote',
        16.25,
        17.5,
        'keynote',
        'Grand Hall',
        'Closing remarks and looking ahead to next year.',
        []
      ]
    ]
  }
];

// ============================================================================
// Chart Configuration and Rendering
// ============================================================================

const HOUR = 52;
const AXIS = 50;

const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const fmt = (h) => {
  let H = Math.floor(h);
  let m = Math.round((h - H) * 60);
  let s = H >= 12 && H < 24 ? 'PM' : 'AM';
  H = H % 12 || 12;
  return m ? `${H}:${String(m).padStart(2, '0')} ${s}` : `${H} ${s}`;
};

const fmtTick = (h) => {
  const H = Math.floor(h) % 12 || 12;
  return H + (h >= 12 && h < 24 ? ' PM' : ' AM');
};

const all = DAYS.flatMap((d) => d.items);
const MIN = Math.floor(Math.min(...all.map((r) => r[1])));
const MAX = Math.ceil(Math.max(...all.map((r) => r[2])));
const SLOTS = Math.max(...DAYS.map((d) => d.items.length));

const grid = Array.from({ length: SLOTS }, (_, k) =>
  DAYS.map((d) => d.items[k] || null)
);

function wrap(ctx, text, w) {
  const out = [];
  let line = '';
  text.split(' ').forEach((word) => {
    const t = line ? line + ' ' + word : word;
    if (ctx.measureText(t).width <= w || !line) {
      line = t;
    } else {
      out.push(line);
      line = word;
    }
  });
  if (line) out.push(line);
  return out;
}

const labelPlugin = {
  id: 'labels',
  afterDatasetsDraw(ch) {
    const ctx = ch.ctx;
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.textBaseline = 'top';
    
    ch.data.datasets.forEach((ds, k) => {
      ch.getDatasetMeta(k).data.forEach((bar, i) => {
        const s = grid[k][i];
        if (!s) return;
        
        const p = bar.getProps(['x', 'y', 'base', 'width'], true);
        const top = Math.min(p.y, p.base);
        const h = Math.abs(p.base - p.y);
        const w = p.width - 12;
        const x = p.x - p.width / 2 + 7;
        
        if (h < 14) return;
        
        if (s[6] && s[6].length) {
          ctx.save();
          ctx.font = '700 11px system-ui, sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText('↗', p.x + p.width / 2 - 8, top + 5);
          ctx.restore();
        }
        
        ctx.save();
        ctx.beginPath();
        ctx.rect(x - 4, top, p.width - 4, h);
        ctx.clip();
        
        ctx.font = '700 12px system-ui, sans-serif';
        const lines = h < 30 ? [wrap(ctx, s[0], w)[0]] : wrap(ctx, s[0], w);
        let y = top + 6;
        
        lines.forEach((l) => {
          ctx.fillText(l, x, y);
          y += 14;
        });
        
        if (h >= y - top + 16) {
          ctx.font = '10px system-ui, sans-serif';
          ctx.globalAlpha = 0.9;
          ctx.fillText(fmt(s[1]), x, y + 1);
        }
        
        ctx.restore();
      });
    });
    
    ctx.restore();
  }
};

let chart;
let sel = null;
const isSel = (c) => sel && sel.k === c.datasetIndex && sel.i === c.dataIndex;
const sheet = document.getElementById('sheet');

function show() {
  const s = grid[sel.k][sel.i];
  
  sheet.querySelector('h2').textContent = s[0];
  sheet.querySelector('.meta').textContent =
    `${fmt(s[1])} – ${fmt(s[2])}` + (s[4] ? ` · ${s[4]}` : '');
  
  const desc = sheet.querySelector('.description');
  desc.textContent = s[5] || '';
  desc.style.display = s[5] ? 'block' : 'none';
  
  const t = sheet.querySelector('.type');
  t.textContent = TYPES[s[3]];
  t.style.background = `var(--${s[3]})`;
  
  const L = sheet.querySelector('.links');
  L.innerHTML = '';
  
  (s[6] || []).forEach(([label, url]) => {
    const a = document.createElement('a');
    a.textContent = label + ' ↗';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    L.appendChild(a);
  });
  
  if (!(s[6] || []).length) {
    const p = document.createElement('span');
    p.className = 'none';
    p.textContent = 'No links available';
    L.appendChild(p);
  }
  
  sheet.classList.add('open');
  document.body.classList.add('sheet-open');
}

function hide() {
  sel = null;
  sheet.classList.remove('open');
  document.body.classList.remove('sheet-open');
}

document.getElementById('x').onclick = () => {
  hide();
  chart.update('none');
};

function build() {
  document.getElementById('box').style.height = (MAX - MIN) * HOUR + 8 + 'px';
  
  if (chart) chart.destroy();
  
  chart = new Chart(document.getElementById('c'), {
    type: 'bar',
    data: {
      labels: DAYS.map((d) => d.name),
      datasets: grid.map((col) => ({
        grouped: false,
        barPercentage: 0.96,
        categoryPercentage: 1,
        data: col.map((s) => (s ? [s[1], s[2]] : null)),
        backgroundColor: col.map((s) => (s ? css('--' + s[3]) : 'transparent')),
        borderColor: (c) => (isSel(c) ? css('--fg') : css('--card')),
        borderWidth: (c) => (isSel(c) ? 3 : 2),
        borderRadius: 8,
        borderSkipped: false
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      onClick: (e, els, ch) => {
        const el = els[0];
        if (el && grid[el.datasetIndex][el.index]) {
          sel = { k: el.datasetIndex, i: el.index };
          show();
        } else {
          hide();
        }
        ch.update('none');
      },
      layout: {
        padding: { top: 2, bottom: 4, left: 0, right: 0 }
      },
      scales: {
        x: { display: false },
        y: {
          reverse: true,
          min: MIN,
          max: MAX,
          afterFit: (a) => {
            a.width = AXIS;
          },
          ticks: {
            stepSize: 1,
            color: css('--mut'),
            font: { size: 11 },
            callback: fmtTick,
            padding: 8
          },
          grid: { color: css('--line') },
          border: { display: false }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: false,
          displayColors: false,
          filter: (i) => !!grid[i.datasetIndex][i.dataIndex],
          callbacks: {
            title: (i) => grid[i[0].datasetIndex][i[0].dataIndex][0],
            label: (i) => {
              const s = grid[i.datasetIndex][i.dataIndex];
              return [
                `${fmt(s[1])} – ${fmt(s[2])}`,
                ...(s[4] ? [s[4]] : [])
              ];
            }
          }
        }
      }
    },
    plugins: [labelPlugin]
  });
}

document.getElementById('legend').innerHTML = Object.entries(TYPES)
  .map(([k, v]) => `<span><i style="background:var(--${k})"></i>${v}</span>`)
  .join('');

document.getElementById('head').innerHTML = DAYS.map(
  (d) => `<div>${d.name}<small>${d.sub}</small></div>`
).join('');

build();

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', build);
</script>
</body>
</html>
