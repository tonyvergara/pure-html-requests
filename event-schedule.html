<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech Conference 2026 - Event Schedule</title>
<style>
:root {
  --bg: #fafaf7;
  --fg: #1d1d1b;
  --mut: #737370;
  --line: #e2e1da;
  --card: #fff;
  --talk: #2563eb;
  --break: #71717a;
  --meal: #ea580c;
  --social: #059669;
  --workshop: #9333ea;
  --keynote: #dc2626;
  --on: #fff;
  --focus: #2563eb;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media(prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615;
    --fg: #f0efe8;
    --mut: #a8a8a0;
    --line: #33332f;
    --card: #1f1f1d;
    --talk: #3b82f6;
    --break: #a1a1aa;
    --meal: #f97316;
    --social: #10b981;
    --workshop: #a855f7;
    --keynote: #ef4444;
    --focus: #60a5fa;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #161615;
  --fg: #f0efe8;
  --mut: #a8a8a0;
  --line: #33332f;
  --card: #1f1f1d;
  --talk: #3b82f6;
  --break: #a1a1aa;
  --meal: #f97316;
  --social: #10b981;
  --workshop: #a855f7;
  --keynote: #ef4444;
  --focus: #60a5fa;
  color-scheme: dark;
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

* {
  box-sizing: border-box;
}

*:focus {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

*:focus:not(:focus-visible) {
  outline: none;
}

*:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

.skip-link {
  position: absolute;
  top: -100px;
  left: 0;
  background: var(--fg);
  color: var(--bg);
  padding: 12px 16px;
  text-decoration: none;
  font-weight: 600;
  z-index: 100;
}

.skip-link:focus {
  top: 10px;
  left: 10px;
}

main {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 10px 16px;
}

h1 {
  font-size: 28px;
  margin: 20px 0 6px;
  font-weight: 700;
}

.sub {
  color: var(--mut);
  margin: 0 0 16px;
  font-size: 15px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 0 0 12px;
  padding: 0;
  list-style: none;
}

.legend li {
  display: flex;
  align-items: center;
  color: var(--fg);
  font-size: 13px;
}

.legend-color {
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 3px;
  margin-right: 6px;
  flex-shrink: 0;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}

.head {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding: 8px 0;
  margin-left: 50px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  border-bottom: 2px solid var(--line);
}

.head div {
  text-align: center;
  font-weight: 700;
  font-size: 15px;
}

.head small {
  display: block;
  font-weight: 400;
  color: var(--mut);
  font-size: 12px;
}

.box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 0 0 12px 12px;
  position: relative;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

.event-list {
  display: none;
}

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  max-width: 800px;
  margin: 0 auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 16px 16px 0 0;
  padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.18);
  transform: translateY(110%);
  transition: transform 0.3s ease;
  z-index: 10;
  visibility: hidden;
}

.sheet.open {
  transform: none;
  visibility: visible;
}

body.sheet-open main {
  padding-bottom: 220px;
}

.sheet h2 {
  font-size: 19px;
  margin: 0 32px 6px 0;
  line-height: 1.3;
}

.sheet .meta {
  color: var(--mut);
  font-size: 14px;
  margin-bottom: 12px;
}

.sheet .description {
  color: var(--fg);
  font-size: 14px;
  margin-bottom: 12px;
  line-height: 1.6;
}

.type {
  display: inline-block;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  border-radius: 999px;
  padding: 3px 10px;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.links a {
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--fg);
  color: var(--bg);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.2s;
}

.links a:hover {
  opacity: 0.85;
  transform: translateY(-1px);
}

.links a:active {
  transform: translateY(0);
}

.links .none {
  color: var(--mut);
  font-size: 13px;
}

.external-icon {
  font-size: 0.85em;
  margin-left: 0.25em;
}

#x {
  position: absolute;
  top: 10px;
  right: 12px;
  width: 36px;
  height: 36px;
  border: 0;
  background: var(--card);
  color: var(--mut);
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
}

#x:hover {
  color: var(--fg);
  background: var(--line);
}

#x:focus {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 9;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease;
}

.backdrop.open {
  opacity: 1;
  visibility: visible;
}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<main id="main-content" role="main">
  <h1>Tech Conference 2026</h1>
  <p class="sub">Click or use keyboard navigation to select any event block for details</p>
  
  <h2 class="sr-only">Event Type Legend</h2>

  <h2 class="sr-only">Schedule Days</h2>
  <div class="head" id="head" role="list" aria-label="Conference days"></div>
  
  <div class="box" id="box" role="application" aria-label="Interactive event schedule" tabindex="0">
    <canvas id="c" aria-label="Event schedule visualization. Use keyboard to navigate events."></canvas>
    <div class="sr-only" role="status" aria-live="polite" aria-atomic="true" id="sr-announce"></div>
  </div>
  
  <!-- Accessible event list for screen readers -->
  <div class="event-list sr-only" role="region" aria-label="Complete event list">
    <h2>All Events</h2>
    <div id="accessible-schedule"></div>
  </div>
</main>

<div class="backdrop" id="backdrop" aria-hidden="true"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="event-title" aria-describedby="event-description">
  <button id="x" aria-label="Close event details dialog">×</button>
  <span class="type" aria-hidden="true"></span>
  <h2 id="event-title"></h2>
  <div class="meta"></div>
  <div class="description" id="event-description"></div>
  <div class="links" role="list"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>

// ============================================================================
// Chart Configuration and Rendering
// ============================================================================

const HOUR = 52;
const AXIS = 50;

const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const fmt = (h) => {
  let H = Math.floor(h);
  let m = Math.round((h - H) * 60);
  let s = H >= 12 && H < 24 ? 'PM' : 'AM';
  H = H % 12 || 12;
  return m ? `${H}:${String(m).padStart(2, '0')} ${s}` : `${H} ${s}`;
};

const fmtTick = (h) => {
  const H = Math.floor(h) % 12 || 12;
  return H + (h >= 12 && h < 24 ? ' PM' : ' AM');
};

const all = DAYS.flatMap((d) => d.items);
const MIN = Math.floor(Math.min(...all.map((r) => r[1])));
const MAX = Math.ceil(Math.max(...all.map((r) => r[2])));
const SLOTS = Math.max(...DAYS.map((d) => d.items.length));

const grid = Array.from({ length: SLOTS }, (_, k) =>
  DAYS.map((d) => d.items[k] || null)
);

function wrap(ctx, text, w) {
  const out = [];
  let line = '';
  text.split(' ').forEach((word) => {
    const t = line ? line + ' ' + word : word;
    if (ctx.measureText(t).width <= w || !line) {
      line = t;
    } else {
      out.push(line);
      line = word;
    }
  });
  if (line) out.push(line);
  return out;
}

const labelPlugin = {
  id: 'labels',
  afterDatasetsDraw(ch) {
    const ctx = ch.ctx;
    ctx.save();
    ctx.fillStyle = '#fff';
    ctx.textBaseline = 'top';
    
    ch.data.datasets.forEach((ds, k) => {
      ch.getDatasetMeta(k).data.forEach((bar, i) => {
        const s = grid[k][i];
        if (!s) return;
        
        const p = bar.getProps(['x', 'y', 'base', 'width'], true);
        const top = Math.min(p.y, p.base);
        const h = Math.abs(p.base - p.y);
        const w = p.width - 12;
        const x = p.x - p.width / 2 + 7;
        
        if (h < 14) return;
        
        if (s[6] && s[6].length) {
          ctx.save();
          ctx.font = '700 11px system-ui, sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText('↗', p.x + p.width / 2 - 8, top + 5);
          ctx.restore();
        }
        
        ctx.save();
        ctx.beginPath();
        ctx.rect(x - 4, top, p.width - 4, h);
        ctx.clip();
        
        ctx.font = '700 12px system-ui, sans-serif';
        const lines = h < 30 ? [wrap(ctx, s[0], w)[0]] : wrap(ctx, s[0], w);
        let y = top + 6;
        
        lines.forEach((l) => {
          ctx.fillText(l, x, y);
          y += 14;
        });
        
        if (h >= y - top + 16) {
          ctx.font = '10px system-ui, sans-serif';
          ctx.globalAlpha = 0.9;
          ctx.fillText(fmt(s[1]), x, y + 1);
        }
        
        ctx.restore();
      });
    });
    
    ctx.restore();
  }
};

let chart;
let sel = null;
let focusedElement = null;
const isSel = (c) => sel && sel.k === c.datasetIndex && sel.i === c.dataIndex;
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const srAnnounce = document.getElementById('sr-announce');
const closeButton = document.getElementById('x');

function announce(message) {
  srAnnounce.textContent = message;
}

function show() {
  const s = grid[sel.k][sel.i];
  
  // Store currently focused element
  focusedElement = document.activeElement;
  
  const eventTitle = sheet.querySelector('#event-title');
  eventTitle.textContent = s[0];
  
  sheet.querySelector('.meta').textContent =
    `${fmt(s[1])} – ${fmt(s[2])}` + (s[4] ? ` · ${s[4]}` : '');
  
  const desc = sheet.querySelector('#event-description');
  desc.textContent = s[5] || '';
  desc.style.display = s[5] ? 'block' : 'none';
  
  const t = sheet.querySelector('.type');
  t.textContent = TYPES[s[3]];
  t.style.background = `var(--${s[3]})`;
  
  const L = sheet.querySelector('.links');
  L.innerHTML = '';
  
  (s[6] || []).forEach(([label, url]) => {
    const a = document.createElement('a');
    a.textContent = label;
    const icon = document.createElement('span');
    icon.className = 'external-icon';
    icon.setAttribute('aria-label', '(opens in new tab)');
    icon.textContent = ' ↗';
    a.appendChild(icon);
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('role', 'listitem');
    L.appendChild(a);
  });
  
  if (!(s[6] || []).length) {
    const p = document.createElement('span');
    p.className = 'none';
    p.textContent = 'No links available';
    L.appendChild(p);
  }
  
  backdrop.classList.add('open');
  sheet.classList.add('open');
  document.body.classList.add('sheet-open');
  backdrop.setAttribute('aria-hidden', 'false');
  
  // Announce to screen readers
  announce(`Event details opened: ${s[0]}`);
  
  // Focus close button
  setTimeout(() => closeButton.focus(), 100);
}

function hide() {
  sel = null;
  sheet.classList.remove('open');
  backdrop.classList.remove('open');
  document.body.classList.remove('sheet-open');
  backdrop.setAttribute('aria-hidden', 'true');
  
  announce('Event details closed');
  
  // Restore focus
  if (focusedElement) {
    setTimeout(() => focusedElement.focus(), 100);
    focusedElement = null;
  }
  
  chart.update('none');
}

// Close button handler
closeButton.onclick = hide;

// Backdrop click to close
backdrop.onclick = hide;

// Escape key handler
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sheet.classList.contains('open')) {
    hide();
  }
});

// Focus trap in dialog
sheet.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    const focusableElements = sheet.querySelectorAll(
      'button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    );
    const firstElement = focusableElements[0];
    const lastElement = focusableElements[focusableElements.length - 1];
    
    if (e.shiftKey && document.activeElement === firstElement) {
      e.preventDefault();
      lastElement.focus();
    } else if (!e.shiftKey && document.activeElement === lastElement) {
      e.preventDefault();
      firstElement.focus();
    }
  }
});

function build() {
  document.getElementById('box').style.height = (MAX - MIN) * HOUR + 8 + 'px';
  
  if (chart) chart.destroy();
  
  chart = new Chart(document.getElementById('c'), {
    type: 'bar',
    data: {
      labels: DAYS.map((d) => d.name),
      datasets: grid.map((col) => ({
        grouped: false,
        barPercentage: 0.96,
        categoryPercentage: 1,
        data: col.map((s) => (s ? [s[1], s[2]] : null)),
        backgroundColor: col.map((s) => (s ? css('--' + s[3]) : 'transparent')),
        borderColor: (c) => (isSel(c) ? css('--fg') : css('--card')),
        borderWidth: (c) => (isSel(c) ? 3 : 2),
        borderRadius: 8,
        borderSkipped: false
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      onClick: (e, els, ch) => {
        const el = els[0];
        if (el && grid[el.datasetIndex][el.index]) {
          sel = { k: el.datasetIndex, i: el.index };
          show();
        } else {
          hide();
        }
        ch.update('none');
      },
      layout: {
        padding: { top: 2, bottom: 4, left: 0, right: 0 }
      },
      scales: {
        x: { display: false },
        y: {
          reverse: true,
          min: MIN,
          max: MAX,
          afterFit: (a) => {
            a.width = AXIS;
          },
          ticks: {
            stepSize: 1,
            color: css('--mut'),
            font: { size: 11 },
            callback: fmtTick,
            padding: 8
          },
          grid: { color: css('--line') },
          border: { display: false }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          enabled: false,
          displayColors: false,
          filter: (i) => !!grid[i.datasetIndex][i.dataIndex],
          callbacks: {
            title: (i) => grid[i[0].datasetIndex][i[0].dataIndex][0],
            label: (i) => {
              const s = grid[i.datasetIndex][i.dataIndex];
              return [
                `${fmt(s[1])} – ${fmt(s[2])}`,
                ...(s[4] ? [s[4]] : [])
              ];
            }
          }
        }
      }
    },
    plugins: [labelPlugin]
  });
}

// Keyboard navigation for chart
let currentSelection = { k: 0, i: 0 };

function findNextEvent(k, i, direction) {
  let newK = k;
  let newI = i;
  
  if (direction === 'right') {
    newI = (newI + 1) % DAYS.length;
  } else if (direction === 'left') {
    newI = (newI - 1 + DAYS.length) % DAYS.length;
  } else if (direction === 'down') {
    newK = (newK + 1) % SLOTS;
  } else if (direction === 'up') {
    newK = (newK - 1 + SLOTS) % SLOTS;
  }
  
  // Skip empty slots
  let attempts = 0;
  const maxAttempts = SLOTS * DAYS.length;
  while (!grid[newK][newI] && attempts < maxAttempts) {
    if (direction === 'right' || direction === 'left') {
      newI = direction === 'right' ? (newI + 1) % DAYS.length : (newI - 1 + DAYS.length) % DAYS.length;
    } else {
      newK = direction === 'down' ? (newK + 1) % SLOTS : (newK - 1 + SLOTS) % SLOTS;
    }
    attempts++;
  }
  
  if (grid[newK][newI]) {
    return { k: newK, i: newI };
  }
  return { k, i };
}

document.getElementById('box').addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].includes(e.key)) {
    e.preventDefault();
    
    if (e.key === 'Enter' || e.key === ' ') {
      sel = currentSelection;
      show();
      return;
    }
    
    const directionMap = {
      'ArrowUp': 'up',
      'ArrowDown': 'down',
      'ArrowLeft': 'left',
      'ArrowRight': 'right'
    };
    
    const direction = directionMap[e.key];
    if (direction) {
      const newSelection = findNextEvent(currentSelection.k, currentSelection.i, direction);
      if (newSelection.k !== currentSelection.k || newSelection.i !== currentSelection.i) {
        currentSelection = newSelection;
        sel = currentSelection;
        const event = grid[currentSelection.k][currentSelection.i];
        announce(`Selected: ${event[0]}, ${TYPES[event[3]]}, ${fmt(event[1])} to ${fmt(event[2])}`);
        chart.update('none');
      }
    }
  }
});

// Initialize legend
document.getElementById('legend').innerHTML = Object.entries(TYPES)
  .map(([k, v]) => `<li><span class="legend-color" style="background:var(--${k})" aria-hidden="true"></span>${v}</li>`)
  .join('');

// Initialize day headers
document.getElementById('head').innerHTML = DAYS.map(
  (d) => `<div role="listitem"><span>${d.name}</span><small>${d.sub}</small></div>`
).join('');

// Create accessible schedule for screen readers
const accessibleSchedule = document.getElementById('accessible-schedule');
DAYS.forEach((day, dayIndex) => {
  const daySection = document.createElement('section');
  daySection.setAttribute('aria-label', `${day.name}, ${day.sub}`);
  
  const dayHeading = document.createElement('h3');
  dayHeading.textContent = `${day.name} - ${day.sub}`;
  daySection.appendChild(dayHeading);
  
  const eventList = document.createElement('ul');
  day.items.forEach((item) => {
    const li = document.createElement('li');
    li.innerHTML = `
      <strong>${item[0]}</strong> - ${TYPES[item[3]]}<br>
      Time: ${fmt(item[1])} – ${fmt(item[2])}<br>
      ${item[4] ? `Location: ${item[4]}<br>` : ''}
      ${item[5] ? `Description: ${item[5]}<br>` : ''}
    `;
    eventList.appendChild(li);
  });
  
  daySection.appendChild(eventList);
  accessibleSchedule.appendChild(daySection);
});

build();

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', build);
</script>
</body>
